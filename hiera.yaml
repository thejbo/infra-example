---
version: 5

defaults:
  datadir: hieradata
  data_hash: yaml_data

hierarchy:
  - name: "hierarchy"
    datadir: "_data/"
    paths:
      - "%{account}/%{region}/%{vpc}/%{unit}.yaml"
      - "%{account}/%{region}/%{vpc}.yaml"
      - "%{account}/%{region}.yaml"
      - "%{account}.yaml"
      - "common.yaml"
